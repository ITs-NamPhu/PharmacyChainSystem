version: "3.9"

services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pharmacy-db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pharmacy-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: PharmacyManagement/Dockerfile

    container_name: pharmacy-api

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PharSystemConnection: "Server=db,1433;Database=PharmacySystem;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RedisConnection: redis:6379

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile

    container_name: pharmacy-ai-agent

    depends_on:
      - api

    ports:
      - "8000:8000"

    env_file:
      - ./ai-agent/.env
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      BACKEND_URL: "http://api:8080"
      LLM_MODEL: "gemini-3.6-flash"

  react:
    build:
      context: ./frontend/pharmacymanage
      dockerfile: Dockerfile

    container_name: pharmacy-react

    depends_on:
      - api

    ports:
      - "3000:3000"

    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_AI_URL: http://localhost:8000
      WDS_SOCKET_PORT: 0

volumes:
  sql_data:
