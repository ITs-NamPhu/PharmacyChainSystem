<div style="font-family: Arial, sans-serif; line-height: 1.6;">
    <h2 style="color: #2c3e50;">Cảm ơn quý khách đã thanh toán tại Nhà Thuốc ABC!</h2>
    <p>Kính gửi anh/chị <strong>{{CustomerName}}</strong>,</p>
    <p>Phiếu thu <strong>số {{ReceiptID}}</strong> đã được lập thành công vào ngày {{CreatedDate}}.</p>

    <table border="1" style="border-collapse: collapse; width: 100%;">
        <tr style="background-color: #f2f2f2;">
            <th>Tổng tiền đã thanh toán</th>
        </tr>
        <tr>
            <td style="text-align: center; color: red; font-weight: bold;">
                {{TotalAmount}} VNĐ
            </td>
        </tr>
    </table>
    <p>Chi tiết phiếu thu vui lòng liên hệ quầy thuốc. Chúc quý khách nhiều sức khỏe!</p>
</div>
