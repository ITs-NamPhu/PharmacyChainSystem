name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Test code
  test-code:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chạy Test
        run: echo "Bước Test thành công!"

  # Job 2: Đóng gói Container
  build-and-package:
    # job test-code phải thành công thì mới chạy
    needs: test-code 
    runs-on: windows-latest
    
    # Cấp quyền cho GitHub Actions ghi file vào kho chứa Packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Kéo mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx (Công cụ hỗ trợ build nâng cao)
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build và đẩy (Push) Docker Image lên GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Đặt tên image theo định dạng: ghcr.io/tên-người-dùng/tên-repo:latest
          tags: ghcr.io/${{ github.repository }}:latest